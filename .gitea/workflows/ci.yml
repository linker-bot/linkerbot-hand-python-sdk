name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Same constraint the dev dependency group declares, so CI and a local
      # checkout resolve the same ruff. Rule selection comes from pyproject
      # only; nothing is selected or ignored here.
      - name: Install ruff
        run: python -m pip install "ruff>=0.16.3"

      - name: ruff check
        run: ruff check src tests

      - name: ruff format --check
        run: ruff format --check src tests
