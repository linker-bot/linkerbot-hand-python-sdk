name: Release

# Tagging is the human action; publishing is automated. ``scripts/release.py tag``
# pushes a signed tag, which triggers this workflow to build and upload. The
# workflow runs the same script, so there is one set of release gates rather than
# one here and another on a developer machine.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Checking out the tag itself is what satisfies publish's "the tag must
          # point at HEAD" gate. fetch-depth 0 is needed by the gates that inspect
          # git: the tracked-file check, the tag/HEAD comparison, and the "sdist
          # contains only committed files" check.
          ref: ${{ github.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install release tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ruff>=0.16.3" build twine pytest pytest-timeout tomli

      - name: Install the package and its dependencies
        env:
          PIP_INDEX_URL: >-
            https://${{ secrets.GITEA_USERNAME }}:${{ secrets.GITEA_TOKEN }}@gitea.linkerhub.work/api/packages/zhuzhixiang/pypi/simple
          PIP_EXTRA_INDEX_URL: https://pypi.org/simple
        # linkerbot-transport lives in this instance's own registry, so the
        # index has to be supplied. It must be an extra index rather than a
        # replacement, or public dependencies such as python-can go missing.
        run: python -m pip install -e .

      - name: Publish
        env:
          GITEA_USERNAME: ${{ secrets.GITEA_USERNAME }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        # Idempotent: skips the upload when the registry already holds this
        # version and skips the Release when one already exists, so a re-run or a
        # local publish beforehand cannot double-publish.
        run: python scripts/release.py publish
