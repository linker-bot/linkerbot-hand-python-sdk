[project]
name = "linkerbot-hand"
version = "1.0.0.dev0"
description = "Lifecycle-safe, transport-neutral Linkerbot hand SDK"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Linkerbot" }]
dependencies = [
  "linkerbot-transport[can,canfd]>=1.0.0rc2,<2.0.0",
]

[project.urls]
Documentation = "https://gitea.linkerhub.work/zhuzhixiang/linkerbot-hand/src/branch/main/docs/zh/src/reference"
Repository = "https://gitea.linkerhub.work/zhuzhixiang/linkerbot-hand"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
  "build>=1.3.0",
  "packaging>=23.1",
  "pytest>=9.1.1",
  "pytest-timeout>=2.4.0",
  "ruff>=0.16.3",
  "tomli>=2.4.1",
  "ty>=0.0.60",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["linkerbot_hand*"]
namespaces = false

[tool.setuptools.package-data]
linkerbot_hand = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests/hand"]
addopts = ["-ra", "--strict-markers", "-m", "not hardware and not interactive"]
markers = [
  "interactive: tests requiring human observation",
  "hardware: tests requiring physical hardware",
  "l6: L6 hand tests",
  "o6: O6 hand tests",
  "l20lite: L20Lite hand tests",
  "l25: L25 hand tests",
  "l30: L30 hand tests",
  "o20: O20 hand tests",
  "o30i: O30i hand tests",
  "canfd: CAN FD communication tests",
  "lifecycle: connection and lifecycle tests",
  "control: angle, speed and torque control tests",
  "sensor: telemetry tests",
  "polling: background polling tests",
  "streaming: event streaming tests",
  "stress: timing and concurrency tests",
  "validation: input and configuration validation tests",
  "error_handling: error propagation and recovery tests",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
extend-select = ["I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["linkerbot", "linkerbot_hand", "linkerbot_transport"]
